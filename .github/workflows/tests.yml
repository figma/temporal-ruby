name: Tests

on:
  push:
    branches: [ "master" ]
  pull_request:

jobs:
  test_generated_bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Verify clean and repeatable protobuf generation
        run: |
          make proto
          git diff --exit-code -- lib/gen
          make proto
          git diff --exit-code -- lib/gen
          generated_dir=$(mktemp -d)
          make proto PROTO_OUT="$generated_dir"
          diff -qr lib/gen "$generated_dir"
          git diff --exit-code -- lib/gen

  test_workflow_updates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TEMPORAL_UPDATE_INTEGRATION: '1'
      TEMPORAL_UPDATE_PORT: '7233'
    steps:
      - uses: actions/checkout@v3
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Start Temporal 1.32
        run: docker compose -f examples/docker-compose-updates.yml up -d
      - name: Wait for the default namespace
        run: |
          bundle exec ruby -rtemporal -rtimeout <<'RUBY'
          Temporal.configure do |config|
            config.host = '127.0.0.1'
            config.port = Integer(ENV.fetch('TEMPORAL_UPDATE_PORT'))
          end
          Timeout.timeout(120) do
            loop do
              begin
                Temporal.describe_namespace('default')
                break
              rescue GRPC::Unavailable, GRPC::NotFound
                sleep 2
              end
            end
          end
          RUBY
      - name: Run live Update and Update-With-Start coverage
        run: bundle exec rspec spec/integration/update_with_start_spec.rb
      - name: Show server logs on failure
        if: failure()
        run: docker compose -f examples/docker-compose-updates.yml logs --tail=100
      - name: Stop dependencies
        if: always()
        run: docker compose -f examples/docker-compose-updates.yml down -v

  test_gem:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@v3

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Run tests
        run: |
          bundle exec rspec

  test_temporalio_coexistence:
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: gemfiles/temporalio.gemfile

    steps:
      - uses: actions/checkout@v3
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Test protobuf coexistence
        run: bundle exec rspec spec/unit/lib/temporal/protobuf_loading_spec.rb

  test_examples_matrix:
    name: test_examples (${{ matrix.server }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - server: legacy
            compose_file: examples/docker-compose.yml
            rspec_args: "--tag ~workflow_id_conflict_policy"
          - server: conflict-policy
            compose_file: examples/docker-compose-conflict-policy.yml
            rspec_args: spec/integration/start_workflow_spec.rb

    steps:
      - uses: actions/checkout@v3

      - name: Start dependencies
        run: |
          docker compose \
            -f ${{ matrix.compose_file }} \
            up -d

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      - name: Bundle install
        run: |
          cd examples && bundle install --path vendor/bundle

      - name: Wait for dependencies to settle
        run: |
          sleep 10

      - name: Register namespace
        run: |
          cd examples && bin/register_namespace ruby-samples

      - name: Wait for namespace to settle
        run: |
          sleep 10

      - name: Boot up worker
        run: |
          cd examples && bin/worker &

      - name: Boot up crypt worker
        env:
          USE_ENCRYPTION: 1
        run: |
          cd examples && bin/worker &

      - name: Boot up worker for v2 error serialization tests
        env:
          USE_ERROR_SERIALIZATION_V2: 1
        run: |
          cd examples && bin/worker &

      - name: Run RSpec
        env:
          USE_ERROR_SERIALIZATION_V2: 1
        run: |
          cd examples && bundle exec rspec ${{ matrix.rspec_args }}

  test_examples:
    if: always()
    needs: test_examples_matrix
    runs-on: ubuntu-latest
    steps:
      - name: Require both example configurations to pass
        run: test "${{ needs.test_examples_matrix.result }}" = "success"
